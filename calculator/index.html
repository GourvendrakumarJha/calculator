<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <meta name="description" content="A small, fast calculator with keyboard support.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="screen">
      <div class="expr" id="expr" aria-hidden="true"></div>
      <output class="value" id="value" aria-live="polite">0</output>
    </div>

    <div class="keys">
      <button class="key fn" data-action="clear" aria-label="Clear all">AC</button>
      <button class="key fn" data-action="backspace" aria-label="Delete last digit">&#9003;</button>
      <button class="key fn" data-action="percent" aria-label="Percent">%</button>
      <button class="key op" data-action="op" data-op="÷" aria-label="Divide">&divide;</button>

      <button class="key" data-action="digit" data-digit="7">7</button>
      <button class="key" data-action="digit" data-digit="8">8</button>
      <button class="key" data-action="digit" data-digit="9">9</button>
      <button class="key op" data-action="op" data-op="×" aria-label="Multiply">&times;</button>

      <button class="key" data-action="digit" data-digit="4">4</button>
      <button class="key" data-action="digit" data-digit="5">5</button>
      <button class="key" data-action="digit" data-digit="6">6</button>
      <button class="key op" data-action="op" data-op="−" aria-label="Subtract">&minus;</button>

      <button class="key" data-action="digit" data-digit="1">1</button>
      <button class="key" data-action="digit" data-digit="2">2</button>
      <button class="key" data-action="digit" data-digit="3">3</button>
      <button class="key op" data-action="op" data-op="+" aria-label="Add">+</button>

      <button class="key fn" data-action="negate" aria-label="Toggle sign">&plusmn;</button>
      <button class="key" data-action="digit" data-digit="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key eq" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
